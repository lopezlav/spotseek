name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version (for example 0.1.0)
        default: "0.1.0"
        required: true
      draft_release:
        description: Create a draft release after both platform checks pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re
          version = os.environ['GITHUB_REF_NAME'][1:] if os.environ['GITHUB_REF_TYPE'] == 'tag' else os.environ['INPUT_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Use a version like 0.1.0 (tag v0.1.0)')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"version={version}\n")
          PY

  # A small LGPL ffmpeg (only what Spotseek and yt-dlp use), built from source once per change of
  # the script and kept in the Actions cache. See scripts/build-ffmpeg.sh.
  ffmpeg:
    name: ffmpeg (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-latest }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-x64, runner: ubuntu-22.04 }
          - { platform: win-x64, runner: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm pkg-config ${{ matrix.platform == 'win-x64' && 'mingw-w64' || '' }}
      - name: Install build tools
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install nasm pkg-config || true
      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh ${{ matrix.platform }} build/ffmpeg
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: build/ffmpeg/*
          if-no-files-found: error

  build:
    needs: [prepare, ffmpeg]
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            platform: darwin-arm64
            arch: arm64
            artifact: Spotseek-macOS-arm64
          # Intel Macs (2015 to 2020), built and tested on an Intel runner.
          - name: macOS (Intel)
            runner: macos-15-intel
            platform: darwin-x64
            arch: x64
            artifact: Spotseek-macOS-x64
          - name: Windows (x64)
            runner: windows-latest
            platform: win-x64
            artifact: Spotseek-Setup-windows
          # The oldest supported Ubuntu, so the build runs on older systems too (glibc 2.35).
          - name: Linux (x64)
            runner: ubuntu-22.04
            platform: linux-x64
            artifact: Spotseek-linux-x64
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Audio (player), D-Bus (password store, file dialog), Wayland and X11 (window).
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev pkg-config \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev xorg-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ui
            engine
      - name: Test and build the engine (spotseek-backend)
        shell: bash
        working-directory: engine
        run: |
          cargo test --release --locked
          cargo build --release --locked
      - name: Test and build the app window (Rune UI)
        shell: bash
        working-directory: ui
        run: |
          cargo test --release --locked
          cargo build --release --locked
      - name: Download verified bundled tools
        run: python scripts/fetch-tools.py build/bin ${{ matrix.platform }}
      - name: Add the ffmpeg built above
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.platform }}
          path: build/bin
      - name: Make the tools executable
        if: runner.os != 'Windows'
        run: chmod +x build/bin/*
      - name: Collect third-party notices
        run: python scripts/collect-notices.py build/notices ${{ matrix.platform }}
      - name: Package and test macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "${{ matrix.arch }}" in arm64) test "$(uname -m)" = arm64 ;; x64) test "$(uname -m)" = x86_64 ;; esac
          # The app window (Rune UI) is the app; the engine runs next to it as its backend.
          # package-mac.sh builds both, adds build/bin and build/notices, and signs ad hoc.
          VERSION="$APP_VERSION" ui/package-mac.sh
          mv ui/target/Spotseek.app Spotseek.app
          codesign --verify --deep --strict Spotseek.app
          python scripts/smoke-test.py Spotseek.app/Contents/Resources/bin Spotseek.app/Contents/MacOS/spotseek Spotseek.app/Contents/MacOS/spotseek-backend
          mkdir -p build/artifacts
          name=Spotseek-macOS-${{ matrix.arch }}
          # The zip is what the app's updater and Homebrew download.
          ditto -c -k --sequesterRsrc --keepParent Spotseek.app "build/artifacts/$name.zip"
          # The disk image is for people: drag Spotseek to Applications.
          dmg=$(mktemp -d)/Spotseek
          mkdir -p "$dmg"
          ditto Spotseek.app "$dmg/Spotseek.app"
          ln -s /Applications "$dmg/Applications"
          hdiutil create -volname Spotseek -srcfolder "$dmg" -fs HFS+ -format UDZO -ov "build/artifacts/$name.dmg"
          hdiutil verify "build/artifacts/$name.dmg"
      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The app window (Rune UI) is Spotseek.exe. The engine is its backend: a
          # console program that the window starts with a hidden console, so the
          # tools it runs (yt-dlp, ffmpeg) do not open windows.
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          Copy-Item engine/target/release/spotseek-backend.exe build/windows/spotseek-backend.exe
          Copy-Item ui/target/release/spotseek.exe build/windows/Spotseek.exe
      - name: Build and test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/installer | Out-Null
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$env:APP_VERSION" packaging/windows/spotseek.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          $installer = (Resolve-Path build/installer/Spotseek-Setup-windows-x64.exe).Path
          $target = Join-Path $env:RUNNER_TEMP "Spotseek smoke test"
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$target`"") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          python scripts/smoke-test.py "$target/bin" "$target/Spotseek.exe" "$target/spotseek-backend.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installed app smoke test failed" }
          if (!(Test-Path "$target/licenses/THIRD_PARTY_NOTICES.md")) { throw "Missing installed notices" }
          if (!(Test-Path "$target/licenses/rust-crates.txt")) { throw "Missing Rust notices" }
          $uninstall = Start-Process -FilePath "$target/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited $($uninstall.ExitCode)" }
          New-Item -ItemType Directory -Force -Path build/artifacts | Out-Null
          Copy-Item $installer build/artifacts/
      - name: Package and test Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # A folder with the app window, the backend, the tools and an install script.
          app=build/linux/Spotseek
          mkdir -p "$app"
          cp engine/target/release/spotseek-backend "$app/spotseek-backend"
          cp ui/target/release/spotseek "$app/spotseek"
          cp -R build/bin "$app/bin"
          cp -R build/notices "$app/licenses"
          cp Icon.png "$app/spotseek.png"
          cp packaging/linux/install.sh packaging/linux/README.txt "$app/"
          chmod +x "$app/spotseek" "$app/spotseek-backend" "$app"/bin/* "$app/install.sh"
          mkdir -p build/artifacts
          tar -C build/linux -czf build/artifacts/Spotseek-linux-x64.tar.gz Spotseek
          # Test what a user gets: unpack, install for a test user, run the smoke test there.
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME=
          mkdir -p "$HOME"
          tar -C "$RUNNER_TEMP" -xzf build/artifacts/Spotseek-linux-x64.tar.gz
          "$RUNNER_TEMP/Spotseek/install.sh"
          installed="$HOME/.local/share/spotseek"
          test -L "$HOME/.local/bin/spotseek"
          grep -q "Exec=\"$installed/spotseek\"" "$HOME/.local/share/applications/spotseek.desktop"
          python scripts/smoke-test.py "$installed/bin" "$installed/spotseek" "$installed/spotseek-backend"
          test -f "$installed/licenses/THIRD_PARTY_NOTICES.md"
          test -f "$installed/licenses/rust-crates.txt"
          "$installed/install.sh" --uninstall
          test ! -e "$installed"
      - name: Build and test the AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          packaging/linux/build-appimage.sh build/linux/Spotseek build/artifacts/Spotseek-linux-x64.AppImage
          # Test what is inside, then that the file itself starts (no FUSE on the runner).
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/build/artifacts/Spotseek-linux-x64.AppImage" --appimage-extract >/dev/null
          python "$GITHUB_WORKSPACE/scripts/smoke-test.py" squashfs-root/bin squashfs-root/spotseek squashfs-root/spotseek-backend
          APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/build/artifacts/Spotseek-linux-x64.AppImage" --list-scenes | grep -q downloading
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.draft_release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          # The install scripts are release files too, so the one-line install has a fixed address.
          cp packaging/install.sh packaging/install.ps1 dist/
          cd dist && sha256sum Spotseek* install.sh install.ps1 > SHA256SUMS.txt
      - name: Create complete draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Spotseek ${{ needs.prepare.outputs.version }}
          body_path: packaging/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*
            THIRD_PARTY_NOTICES.md
            LICENSE
            packaging/tools.json
