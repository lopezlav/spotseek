[package]
name = "spotseek-ui"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false
description = "Spotseek's Rune front end. It runs the Go backend (spotseek-app --cli --events) and draws its events."

[[bin]]
name = "spotseek"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924", features = ["native-file-dialog"] }
rune-fx = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }
rune-motion = { git = "https://github.com/anomalyco/rune", rev = "4ca683561a100e16b1ce32f3576f4ade61bd2924" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-mp3"] }
id3 = "1.17.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan", "dx12"] }

[profile.release]
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2
debug = false
